<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0D0D0F"/>
  <!-- Book spine -->
  <rect x="7" y="6" width="3" height="20" rx="1.5" fill="#22D3EE"/>
  <!-- Book pages -->
  <rect x="9" y="6" width="16" height="20" rx="2" fill="#1a1a1f"/>
  <rect x="9" y="6" width="16" height="20" rx="2" fill="none" stroke="#22D3EE" stroke-width="1.2" opacity="0.6"/>
  <!-- Lines on book -->
  <line x1="12" y1="11" x2="21" y2="11" stroke="#22D3EE" stroke-width="1.1" opacity="0.8" stroke-linecap="round"/>
  <line x1="12" y1="14.5" x2="21" y2="14.5" stroke="#22D3EE" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
  <line x1="12" y1="18" x2="18" y2="18" stroke="#22D3EE" stroke-width="1.1" opacity="0.35" stroke-linecap="round"/>
</svg>
